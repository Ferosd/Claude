<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Coremagna</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/motion.css">
<style>
:root {
  --bg: #060a0e;
  --surface: #0d1117;
  --text: #F0F4F3;
  --text-secondary: #c0ccd8;
  --text-muted: #8a9ba8;
  --border: #1a2530;
  --accent: #00D4AA;
  --accent-dim: rgba(0,212,170,0.12);
}
[data-theme="light"] {
  --bg: #fafbfc;
  --surface: #ffffff;
  --text: #0a1014;
  --text-secondary: #2a3340;
  --text-muted: #5a6b78;
  --border: #e1e5ea;
  --accent: #00B894;
  --accent-dim: rgba(0,184,148,0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.wrap {
  flex: 1;
  display: flex;
  align-items: center;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 0 32px;
}
.inner { max-width: 560px; }
.code {
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 14px;
  color: var(--accent);
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
h1 {
  font-family: 'Cabinet Grotesk', sans-serif;
  font-weight: 800;
  font-size: clamp(2.4rem, 5vw, 3.5rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  max-width: 720px;
  overflow-wrap: break-word;
  hyphens: none;
  margin-bottom: 20px;
}
p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 32px; }
.actions { display: flex; gap: 14px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-primary { background: var(--accent); color: #06110d; }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); transform: translateY(-2px); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.logo {
  padding: 28px 32px;
  font-family: 'Cabinet Grotesk', sans-serif;
  font-weight: 800;
  font-size: 20px;
  color: var(--text);
  text-decoration: none;
  display: inline-block;
}
.logo span { color: var(--accent); }
@media (max-width: 768px) {
  .wrap { padding: 0 20px; }
  .logo { padding: 24px 20px; }
  body { padding-bottom: 24px; }
}
</style>
</head>
<body>
<a href="/" class="logo" aria-label="Coremagna home">Coremagna<span>.</span></a>
<main id="main" class="wrap">
  <div class="inner">
    <p class="code">404 — NOT FOUND</p>
    <h1>This page took the day off</h1>
    <p>The address you followed doesn't exist or has moved. The rest of the site is still working — here are the fastest ways back.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/industries">Browse industries</a>
      <a class="btn btn-ghost" href="/blog/">Read the blog</a>
    </div>
  </div>
</main>
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</body>
</html>
